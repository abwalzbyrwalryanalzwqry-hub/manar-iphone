name: اختبار الأذان والإقامة على محاكي

# يبني نسختي التصحيح والإصدار، ويتحقق ساكنًا أن ملفات الإقامة الـ١٩ داخل APK
# وAAB وأن حزمة الويب لا تحمل أي رابط صوتي خارجي، ثم يشغّل
# scripts/android-runtime-test.sh على محاكيين حقيقيين (أندرويد ٧ و١٤):
# فكّ كل ملف إقامة وتشغيله، وتدفّق أذان ← تنبيه ← إقامة والتطبيق مغلق والشاشة
# مطفأة ووضع الطيران مفعّل، ومنع التكرار، وإعادة تشغيل الجهاز، ثم أذان وإقامة
# حقيقيان من جدول حزمة الإصدار نفسها بتقديم ساعة الجهاز.

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "src/lib/**"
      - "src/components/manar/adhan-provider.tsx"
      - "public/audio/**"
      - "scripts/**"
      - ".github/workflows/android-runtime-test.yml"
  workflow_dispatch:

# أقل صلاحيات لازمة لرمز GITHUB_TOKEN (قراءة فقط).
permissions:
  contents: read

concurrency:
  group: runtime-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: بناء وفحص ساكن
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # التاريخ كاملاً لأن versionCode = عدد الالتزامات.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # خط ثمانية من المستودع الخاص manar-fonts (ترخيصه يمنع رفعه هنا). إلزامي لبناء main
      # والإصدار، واختياري لطلبات الدمج التي لا تصلها الأسرار (Dependabot والتفرعات).
      - name: جلب خط ثمانية
        id: fonts
        env:
          MANAR_FONTS_DEPLOY_KEY: ${{ secrets.MANAR_FONTS_DEPLOY_KEY }}
          MANAR_REQUIRE_FONTS: ${{ github.event_name != 'pull_request' }}
        run: bash scripts/fetch-thmanyah-fonts.sh

      - run: npm ci --no-audit --no-fund
      - run: npm run build:android

      - name: التحقق من تضمين خط ثمانية في الحزمة
        if: steps.fonts.outputs.fetched == 'true'
        run: |
          n=$(ls android/app/src/main/assets/public/fonts/thmanyah-*.woff2 2>/dev/null | wc -l)
          [ "$n" -eq 7 ] || { echo "::error::خط ثمانية غير مضمّن في الحزمة ($n/7)"; exit 1; }
          echo "خط ثمانية مضمّن (7/7)."

      - name: لا روابط صوت خارجية في حزمة الويب
        run: |
          if grep -rEoh "https?://[^\"' )]+\.(mp3|ogg|m4a|opus|wav|aac)" android/app/src/main/assets/public; then
            echo "::error::رابط صوت خارجي داخل حزمة التطبيق"; exit 1
          fi
          echo "لا روابط صوت خارجية."

      - name: بناء التصحيح والإصدار
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: ملفات الإقامة داخل APK وAAB
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          # العدد المتوقع من ملفات المكتبة نفسها (حُذفت iqamah_01…07 عمداً، فلم يعد ١٩ ثابتاً).
          expected=$(ls public/audio/iqamah | grep -cE "^iqamah_[0-9]{2}\.")
          test "$expected" -gt 0
          "$AAPT2" dump resources "$APK" > res.txt
          n=$(grep -cE "raw/iqamah_[0-9]{2}" res.txt || true)
          echo "APK: $n مورد إقامة من $expected"; grep -E "raw/iqamah_" res.txt
          test "$n" = "$expected"
          unzip -l "$AAB" | grep -E "base/res/raw/iqamah_" | tee aab.txt
          test "$(wc -l < aab.txt)" = "$expected"
          ls -la "$APK" "$AAB"

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-test-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 5

  emulator:
    name: محاكي API ${{ matrix.api }}
    needs: build
    # نظام مثبّت لا ubuntu-latest: انتقال latest إلى Ubuntu 26 (١٩ أكتوبر ٢٠٢٦) قد يكسر
    # KVM والمحاكي؛ نرقّي يدوياً بعد التحقق.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # صورة API 24 (x86) تتجمّد أحياناً على عدّاءات GitHub بعد إطفاء الشاشة فلا يستجيب
    # المحاكي لأي أمر adb — عطل بيئة لا تطبيق. نتيجتها تُعرض ولا تمنع الدمج؛ API 34 هو البوّابة.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # صورة API 24 بمعمارية x86_64 لا تُقلع على عدّاءات GitHub؛ x86 أقل تجمّداً.
          - api: 24
            arch: x86
            target: default
            experimental: true
          - api: 34
            arch: x86_64
            target: google_apis
            experimental: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: runtime-test-apks
          path: pkg
      - name: تمكين KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: الاختبار
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_6
          emulator-boot-timeout: 900
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/android-runtime-test.sh "$(find pkg -name app-debug.apk | head -1)" "$(find pkg -name app-release.apk | head -1)" evidence-${{ matrix.api }}
      - name: رفع الأدلة
        if: always()
        # مخرج مساعد: امتلاء حصة التخزين في GitHub لا يُسقط فحصاً نجحت خطواته كلها.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: runtime-evidence-api${{ matrix.api }}
          path: evidence-${{ matrix.api }}
          if-no-files-found: warn
      - name: ملخص النتائج في التعليقات
        if: always()
        run: |
          D=evidence-${{ matrix.api }}
          emit() { # emit <level> <title> <file> — يقسم الملف إلى تعليقات قصيرة تُقرأ من واجهة GitHub وواجهتها البرمجية
            [ -s "$3" ] || return 0
            rm -rf chunks && mkdir chunks
            split -C 3000 "$3" chunks/c_
            for c in chunks/c_*; do
              body=$(tr -d '\r' < "$c" | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::$1 title=$2::$body"
            done
          }
          grep -E "^FAIL" "$D/summary.txt" > fails.txt || true
          grep -E "^NOTE" "$D/summary.txt" > notes.txt || true
          emit error "API ${{ matrix.api }} فشل" fails.txt
          emit notice "API ${{ matrix.api }} ملاحظات" notes.txt
          emit notice "API ${{ matrix.api }} تشخيص" "$D/diag.txt"
