name: إصدار الاندرويد

# تشغيل يدوي فقط: بعد كل إضافة أو تعديل، شغّل هذا السير من تبويب Actions
# (Run workflow) فيُبنى APK إصدار موقَّع بمفتاح منار المحفوظ في أسرار المستودع:
#   MANAR_KEYSTORE_BASE64 · MANAR_STORE_PASSWORD · MANAR_KEY_ALIAS · MANAR_KEY_PASSWORD
# على خلاف «بناء أندرويد»، لا يسقط هنا إلى مفتاح التصحيح أبداً: غياب أي سرّ يوقف البناء.

on:
  workflow_dispatch:
    inputs:
      aab:
        description: بناء حزمة AAB لـ Google Play أيضاً
        type: boolean
        default: false
      publish:
        description: نشر الحزمة في إصدار على GitHub (Releases) إضافةً إلى الأثر
        type: boolean
        default: false

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: APK إصدار موقَّع
    runs-on: ubuntu-24.04
    permissions:
      contents: write # لإنشاء إصدار GitHub عند اختيار «نشر»
    timeout-minutes: 45
    steps:
      # التاريخ كاملاً: versionCode = عدد الالتزامات (android/app/build.gradle).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: التحقق من أسرار التوقيع
        env:
          KEYSTORE_B64: ${{ secrets.MANAR_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MANAR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MANAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MANAR_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ]   || missing="$missing MANAR_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing MANAR_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]      || missing="$missing MANAR_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]   || missing="$missing MANAR_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::أسرار التوقيع ناقصة:$missing"
            exit 1
          fi
          echo "أسرار التوقيع الأربعة موجودة."

      # خط ثمانية من المستودع الخاص manar-fonts — إلزامي للإصدار.
      - name: جلب خط ثمانية
        env:
          MANAR_FONTS_DEPLOY_KEY: ${{ secrets.MANAR_FONTS_DEPLOY_KEY }}
          MANAR_REQUIRE_FONTS: "true"
        run: bash scripts/fetch-thmanyah-fonts.sh

      - name: تنصيب الحزم
        run: npm ci --no-audit --no-fund

      - name: بناء حزمة الويب ومزامنة Capacitor
        run: npm run build:android

      - name: التحقق من تضمين خط ثمانية في الحزمة
        run: |
          n=$(ls android/app/src/main/assets/public/fonts/thmanyah-*.woff2 2>/dev/null | wc -l)
          [ "$n" -eq 7 ] || { echo "::error::خط ثمانية غير مضمّن في الحزمة ($n/7)"; exit 1; }
          echo "خط ثمانية مضمّن (7/7)."

      - name: تجهيز مفتاح التوقيع
        env:
          KEYSTORE_B64: ${{ secrets.MANAR_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > android/manar-release.keystore

      - name: بناء APK الإصدار الموقَّع
        working-directory: android
        env:
          MANAR_KEYSTORE: manar-release.keystore
          MANAR_STORE_PASSWORD: ${{ secrets.MANAR_STORE_PASSWORD }}
          MANAR_KEY_ALIAS: ${{ secrets.MANAR_KEY_ALIAS }}
          MANAR_KEY_PASSWORD: ${{ secrets.MANAR_KEY_PASSWORD }}
          # أي خلل في المفتاح يوقف البناء بدل توقيع الإصدار بمفتاح التصحيح.
          MANAR_REQUIRE_RELEASE_SIGNING: "true"
        run: |
          tasks="assembleRelease"
          [ "${{ inputs.aab }}" = "true" ] && tasks="$tasks bundleRelease"
          ./gradlew --no-daemon $tasks

      - name: حذف المفتاح
        if: always()
        run: rm -f android/manar-release.keystore

      - name: تسمية الحزم والتحقق من التوقيع
        id: out
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(git rev-list --count HEAD)
          SHORT=${GITHUB_SHA::7}
          NAME="manar-v${VERSION}-${CODE}"
          mkdir -p out
          apk=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          [ -n "$apk" ] || { echo "::error::لم يُنتج البناء ملف APK"; exit 1; }
          cp "$apk" "out/${NAME}.apk"
          aab=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n1 || true)
          [ -n "$aab" ] && cp "$aab" "out/${NAME}.aab"

          # التأكد أن الحزمة موقّعة بمفتاح الإصدار لا بمفتاح التصحيح.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner
          "$APKSIGNER" verify --print-certs "out/${NAME}.apk" | tee cert.txt
          if grep -qi "CN=Android Debug" cert.txt; then
            echo "::error::الحزمة موقّعة بمفتاح التصحيح!"; exit 1
          fi
          (cd out && sha256sum * > SHA256SUMS.txt)

          {
            echo "## منار ${VERSION} (versionCode ${CODE})"
            echo ""
            echo "- الالتزام: \`${SHORT}\`"
            echo "- الفرع: \`${GITHUB_REF_NAME}\`"
            echo ""
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: رفع الحزم كأثر
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.out.outputs.name }}
          path: out/*
          retention-days: 30
          if-no-files-found: error

      - name: نشر إصدار على GitHub
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.out.outputs.version }}-${{ steps.out.outputs.code }}"
          gh release create "$TAG" out/* --target "$GITHUB_SHA" \
            --title "منار ${{ steps.out.outputs.version }} (${{ steps.out.outputs.code }})" \
            --notes "إصدار أندرويد موقَّع، مبني آلياً من الالتزام ${GITHUB_SHA::7}."
          echo "نُشر الإصدار \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
