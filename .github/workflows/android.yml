name: بناء أندرويد

# العطل الذي استُهلك عليه أربعة طلبات دمج (شاشة بداية خضراء لا تختفي، ثم
# TypeError عند الإقلاع) كان سيُكتشف من أول بناء آلي. هذا الملف يبني حزمة
# أندرويد فعلياً ويرفعها كأثر، فيصير لكل التزام على main نسخة قابلة للتجربة.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release:
        description: بناء إصدار موقَّع (يتطلّب أسرار المفتاح)
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: حزمة APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write # احتياط الحصة: رفع الحزم إلى إصدار مسودة خاص
    timeout-minutes: 40
    steps:
      # التاريخ كاملاً: versionCode = عدد الالتزامات (android/app/build.gradle).
      # النسخة السطحية الافتراضية تعطي ١ لكل بناء.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Capacitor 7 و AGP الحالي يحتاجان JDK 21 — وهو ما يضبطه build.gradle.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # خط ثمانية من المستودع الخاص manar-fonts (ترخيصه يمنع رفعه هنا). إلزامي لبناء main
      # والإصدار، واختياري لطلبات الدمج التي لا تصلها الأسرار (Dependabot والتفرعات).
      - name: جلب خط ثمانية
        id: fonts
        env:
          MANAR_FONTS_DEPLOY_KEY: ${{ secrets.MANAR_FONTS_DEPLOY_KEY }}
          MANAR_REQUIRE_FONTS: ${{ github.event_name != 'pull_request' }}
        run: bash scripts/fetch-thmanyah-fonts.sh

      - name: تنصيب الحزم
        run: npm ci --no-audit --no-fund

      # VITE_NATIVE_SHELL=1 مضمّن في السكربت: يجعل الصفحة المُسبَقة تُطابق ما
      # يرسمه العميل داخل القشرة الأصلية، فلا يقع عدم تطابق ترطيب عند الإقلاع.
      - name: بناء حزمة الويب ومزامنة Capacitor
        run: npm run build:android

      - name: التحقق من تضمين خط ثمانية في الحزمة
        if: steps.fonts.outputs.fetched == 'true'
        run: |
          n=$(ls android/app/src/main/assets/public/fonts/thmanyah-*.woff2 2>/dev/null | wc -l)
          [ "$n" -eq 7 ] || { echo "::error::خط ثمانية غير مضمّن في الحزمة ($n/7)"; exit 1; }
          echo "خط ثمانية مضمّن (7/7)."

      # المفتاح يُحفظ في أسرار المستودع base64، ولا يلمس الشجرة إلا هنا.
      - name: تجهيز مفتاح التوقيع
        id: signing
        if: ${{ github.event_name == 'push' || inputs.release }}
        env:
          KEYSTORE_B64: ${{ secrets.MANAR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "لا مفتاح توقيع في الأسرار — سيُبنى APK تصحيح فقط."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/manar-release.keystore
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: بناء APK إصدار موقَّع
        if: steps.signing.outputs.signed == 'true'
        working-directory: android
        env:
          MANAR_KEYSTORE: manar-release.keystore
          MANAR_STORE_PASSWORD: ${{ secrets.MANAR_STORE_PASSWORD }}
          MANAR_KEY_ALIAS: ${{ secrets.MANAR_KEY_ALIAS }}
          MANAR_KEY_PASSWORD: ${{ secrets.MANAR_KEY_PASSWORD }}
          # أي خلل في المفتاح يوقف البناء بدل توقيع الإصدار بمفتاح التصحيح.
          MANAR_REQUIRE_RELEASE_SIGNING: "true"
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: بناء APK تصحيح
        if: steps.signing.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # التقرير الكامل لفحص أندرويد. لا يوقف البناء بعد (المرحلة ٣١): يُراجَع أول
      # تقرير ثم يُشدَّد. الأخطاء القاتلة وحدها توقف بناء الإصدار (lintVitalRelease).
      - name: فحص أندرويد (تقرير)
        continue-on-error: true
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - name: رفع تقرير الفحص
        if: always()
        # مخرج مساعد: امتلاء حصة التخزين في GitHub لا يُسقط فحصاً نجحت خطواته كلها.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: manar-android-lint-${{ github.sha }}
          path: android/app/build/reports/lint-results-*.*
          retention-days: 14
          if-no-files-found: ignore

      - name: حذف المفتاح
        if: always()
        run: rm -f android/manar-release.keystore

      - name: رفع الحزم
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: manar-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          retention-days: 14
          if-no-files-found: error

      # احتياط حصة المرفقات (كما في زِن): إن امتلأت حصة Actions تُحفظ الحزم في إصدار مسودة خاص
      # بالمستودع (لا يُنشر ولا يراه غير المتعاونين)، فلا يضيع بناء main. على طلبات الدمج يكفي التنبيه.
      - name: حفظ الحزم في إصدار مسودة (احتياط الحصة)
        if: steps.artifact.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p out
          find android/app/build/outputs -name "*.apk" -o -name "*.aab" | while read f; do
            cp "$f" "out/manar-$(basename "$(dirname "$f")")-$(basename "$f")"
          done
          ls out | grep -q . || { echo "لا حزم للحفظ"; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          TAG="build-v${VERSION}-${GITHUB_SHA::7}"
          gh release create "$TAG" out/* --draft --target "$GITHUB_SHA" \
            --title "منار $VERSION (${GITHUB_SHA::7})" --notes "بناء آلي من main؛ حصة مرفقات Actions ممتلئة."
          echo "الحزم في الإصدار المسودة \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"

      - name: تنبيه تعذّر رفع الحزم على طلب دمج
        if: steps.artifact.outcome == 'failure' && github.event_name == 'pull_request'
        run: echo "::warning::تعذّر رفع الحزم (غالباً امتلاء حصة مرفقات Actions)؛ البناء نفسه نجح."
