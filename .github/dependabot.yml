version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Capacitor 8 يغيّر الجسر الأصلي وحزم Swift — ترقية مقصودة لا آلية.
    ignore:
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor-community/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
